name: "warehouse"
version: "1.0.0"
config-version: 2

profile: "warehouse"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  warehouse:
    staging:
      +materialized: view
    marts:
      +materialized: table

seeds:
  warehouse:
    +schema: seed_data
